<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OXeall Bracket Studio</title>
  <meta name="description" content="Private tournament bracket builder & visualizer (Swiss / Single / Double / Groups) with news + PNG export." />

  <!-- PNG export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg:#0b0d12;
      --bg2:#0f1220;
      --panel:#12172a;
      --panel2:#141a30;
      --border:#262d4a;
      --text:#e8ebf7;
      --muted:#9aa3bf;
      --accent:#ffb000;
      --good:#3ddc97;
      --warn:#ffcc66;
      --bad:#ff5d5d;
      --shadow: 0 12px 34px rgba(0,0,0,.35);
      --r16:16px;
      --r12:12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    [data-theme="light"]{
      --bg:#f6f7fb;
      --bg2:#ffffff;
      --panel:#ffffff;
      --panel2:#fbfbfe;
      --border:#e2e6f2;
      --text:#101428;
      --muted:#5b6476;
      --shadow: 0 12px 34px rgba(20,30,60,.10);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(900px 450px at 25% -10%, rgba(255,176,0,.18), transparent 60%),
        radial-gradient(900px 450px at 90% 0%, rgba(61,220,151,.12), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    .topbar{
      position:sticky; top:0; z-index:30;
      backdrop-filter: blur(14px);
      background: rgba(10,12,18,.72);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    [data-theme="light"] .topbar{
      background: rgba(255,255,255,.72);
      border-bottom:1px solid var(--border);
    }
    .wrap{max-width:1300px;margin:0 auto;padding:0 16px}
    .topbar__inner{
      padding:12px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .brand{
      display:flex; align-items:baseline; gap:10px;
      text-decoration:none; color:var(--text);
    }
    .brand__mark{
      font-weight:900; letter-spacing:.5px;
      padding:6px 10px; border-radius:12px;
      background: linear-gradient(90deg, var(--accent), #ffd36b);
      color:#141414;
    }
    .brand__name{font-weight:900}
    .brand__tag{font-size:12px;color:var(--muted)}

    .nav{
      display:flex; gap:8px; flex:1; margin-left:8px;
    }
    .nav a{
      text-decoration:none;
      color:var(--muted);
      padding:8px 10px;
      border-radius:12px;
      border:1px solid transparent;
      font-weight:700;
      font-size:13px;
    }
    .nav a:hover{
      color:var(--text);
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.08);
    }
    .nav a.active{
      color:var(--text);
      background: rgba(255,176,0,.12);
      border-color: rgba(255,176,0,.25);
    }

    .actions{display:flex; gap:10px; align-items:center}
    .btn{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color:var(--text);
      cursor:pointer;
      font-weight:800;
      font-size:13px;
    }
    [data-theme="light"] .btn{border-color:var(--border); background:#fff;}
    .btn:hover{border-color: rgba(255,176,0,.35); background: rgba(255,176,0,.08);}
    .btn--ghost{background:transparent}
    .btn--danger:hover{border-color: rgba(255,93,93,.35); background: rgba(255,93,93,.10);}

    .search{
      position:relative;
    }
    .search input{
      width:320px;
      padding:10px 34px 10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
      font-weight:700;
      font-size:13px;
    }
    [data-theme="light"] .search input{border-color:var(--border); background:#fff;}
    .search input:focus{border-color: rgba(255,176,0,.45); box-shadow: 0 0 0 4px rgba(255,176,0,.12);}
    .search .x{
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:22px; height:22px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      display:grid; place-items:center;
      font-weight:900;
    }
    .search .x:hover{color:var(--text); border-color: rgba(255,176,0,.35);}

    .layout{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:16px;
      padding:16px 0 24px;
      align-items:start;
    }
    @media (max-width: 1100px){
      .layout{grid-template-columns:1fr}
      .search input{width:100%}
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--r16);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    [data-theme="light"] .panel{
      border-color:var(--border);
      background: linear-gradient(180deg, #fff, #fbfbfe);
    }
    .panel__head{
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.07);
      display:flex; justify-content:space-between; gap:10px;
      align-items:baseline;
    }
    [data-theme="light"] .panel__head{border-bottom:1px solid var(--border);}
    .panel__title{margin:0; font-size:14px; font-weight:900}
    .panel__meta{color:var(--muted); font-size:12px}
    .panel__body{padding:14px 16px}

    .divider{height:1px;background:rgba(255,255,255,.07); margin:12px 0}
    [data-theme="light"] .divider{background:var(--border);}

    .field{margin-bottom:10px}
    .label{display:flex; justify-content:space-between; gap:10px; margin-bottom:6px; color:var(--muted); font-size:12px; font-weight:800}
    .input, .select, .textarea{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color:var(--text);
      outline:none;
      font-weight:800;
      font-size:13px;
    }
    [data-theme="light"] .input, [data-theme="light"] .select, [data-theme="light"] .textarea{
      background:#fff; border-color:var(--border);
    }
    .textarea{min-height:90px; resize:vertical; font-weight:700; line-height:1.35}

    .row{display:flex; gap:10px}
    .row > *{flex:1}

    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      color:var(--muted);
      font-size:12px;
      font-weight:900;
      background: rgba(255,255,255,.04);
    }
    [data-theme="light"] .pill{border-color:var(--border); background:#fff;}
    .pill.good{border-color: rgba(61,220,151,.35); color:var(--good); background: rgba(61,220,151,.08);}
    .pill.warn{border-color: rgba(255,204,102,.35); color:var(--warn); background: rgba(255,204,102,.08);}
    .pill.bad{border-color: rgba(255,93,93,.35); color:var(--bad); background: rgba(255,93,93,.08);}

    .table{width:100%; border-collapse:separate; border-spacing:0 8px}
    .table th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      padding:0 10px 6px;
    }
    .table td{
      padding:10px;
      background: rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.10);
      font-weight:800;
      font-size:13px;
    }
    [data-theme="light"] .table td{background:#fff; border-color:var(--border);}
    .table tr td:first-child{border-radius:12px 0 0 12px}
    .table tr td:last-child{border-radius:0 12px 12px 0}

    .chipbar{display:flex; flex-wrap:wrap; gap:8px}
    .chip{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--muted);
      cursor:pointer;
      font-weight:900;
      font-size:12px;
    }
    [data-theme="light"] .chip{border-color:var(--border); background:#fff;}
    .chip:hover{border-color: rgba(255,176,0,.35); color:var(--text); background: rgba(255,176,0,.08);}
    .chip.on{border-color: rgba(255,176,0,.45); color:var(--text); background: rgba(255,176,0,.12);}

    /* Bracket canvas */
    .canvasWrap{
      padding:14px;
      background: rgba(0,0,0,.10);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--r16);
      overflow:auto;
    }
    [data-theme="light"] .canvasWrap{background:#fff; border-color:var(--border);}

    .canvas{
      min-width: 980px;
      border-radius: var(--r16);
      background:
        radial-gradient(900px 450px at 30% -20%, rgba(255,176,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.07);
      padding:16px;
    }
    [data-theme="light"] .canvas{border-color:var(--border); background: linear-gradient(180deg, #fff, #fbfbfe);}

    .canvasHead{
      display:flex; justify-content:space-between; gap:12px; align-items:flex-end;
      padding:8px 10px 14px;
      border-bottom:1px solid rgba(255,255,255,.07);
      margin-bottom:12px;
    }
    [data-theme="light"] .canvasHead{border-bottom:1px solid var(--border);}
    .canvasTitle{font-size:16px; font-weight:1000; margin:0}
    .canvasSub{color:var(--muted); font-size:12px; font-weight:900}

    /* Swiss view */
    .swissGrid{display:grid; grid-template-columns: 1fr 1.2fr; gap:14px; align-items:start}
    @media (max-width: 1100px){ .swissGrid{grid-template-columns:1fr} .canvas{min-width: 0} }

    .cards{display:grid; gap:10px}
    .card{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
      border-radius: 14px;
      padding:12px;
    }
    [data-theme="light"] .card{background:#fff; border-color:var(--border);}
    .cardTop{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
    .kicker{font-size:12px; color:var(--muted); font-family:var(--mono); font-weight:900}
    .title{font-size:13px; font-weight:1000; margin-top:6px}
    .sub{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.35; font-weight:800}

    .match{
      border:1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      padding:10px;
    }
    [data-theme="light"] .match{background:#fff; border-color:var(--border);}
    .matchRow{display:flex; justify-content:space-between; gap:10px; align-items:center}
    .team{
      display:flex; align-items:center; gap:10px; min-width:0;
      font-weight:1000;
    }
    .logo{
      width:26px; height:26px; border-radius:10px;
      border:1px solid rgba(255,176,0,.35);
      background: rgba(255,176,0,.18);
      display:grid; place-items:center;
      font-size:12px; font-weight:1000;
    }
    .teamName{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .seed{font-family:var(--mono); color:var(--muted); font-weight:900}
    .score{
      display:flex; align-items:center; gap:8px;
      font-family:var(--mono);
      font-weight:1000;
    }
    .score input{
      width:56px;
      padding:8px 8px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color:var(--text);
      outline:none;
      font-weight:1000;
      text-align:center;
    }
    [data-theme="light"] .score input{background:#fff; border-color:var(--border);}
    .miniBtn{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color:var(--text);
      cursor:pointer;
      font-weight:1000;
      font-size:12px;
      white-space:nowrap;
    }
    [data-theme="light"] .miniBtn{border-color:var(--border); background:#fff;}
    .miniBtn:hover{border-color: rgba(255,176,0,.35); background: rgba(255,176,0,.08);}
    .miniBtn.danger:hover{border-color: rgba(255,93,93,.35); background: rgba(255,93,93,.10);}

    /* Brackets (single/double) via SVG */
    .svgWrap{
      width:100%;
      overflow:auto;
      border-radius: var(--r16);
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.12);
    }
    [data-theme="light"] .svgWrap{border-color:var(--border); background:#fff;}
    svg{display:block}

    /* Modal */
    .modalBack{
      position:fixed; inset:0; z-index:100;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center; justify-content:center;
      padding:18px;
    }
    .modal{
      max-width: 760px;
      width:100%;
      border-radius: var(--r16);
      border:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    [data-theme="light"] .modal{border-color:var(--border); background: linear-gradient(180deg, #fff, #fbfbfe);}
    .modalHead{
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.07);
      display:flex; justify-content:space-between; align-items:center; gap:10px;
    }
    [data-theme="light"] .modalHead{border-bottom:1px solid var(--border);}
    .modalBody{padding:14px 16px}
    .modalFoot{padding:14px 16px; border-top:1px solid rgba(255,255,255,.07); display:flex; justify-content:flex-end; gap:10px}
    [data-theme="light"] .modalFoot{border-top:1px solid var(--border);}
    .modalTitle{margin:0; font-size:14px; font-weight:1000}

    /* Presentation mode */
    body.presentation .topbar,
    body.presentation .leftPane,
    body.presentation .panel__head .rightControls,
    body.presentation .newsPane{
      display:none !important;
    }
    body.presentation .layout{
      grid-template-columns: 1fr;
      padding-top: 12px;
    }
    body.presentation .panel{
      box-shadow:none;
      border:none;
      background: transparent;
    }
    body.presentation .canvasWrap{
      border:none;
      background: transparent;
      padding:0;
    }
    body.presentation .canvas{
      border:1px solid rgba(255,255,255,.10);
    }

    .hint{color:var(--muted); font-size:12px; line-height:1.4; font-weight:800}
    .dangerText{color:var(--bad); font-weight:1000}
    .okText{color:var(--good); font-weight:1000}
    .muted{color:var(--muted)}
    .mono{font-family:var(--mono)}
  </style>
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="#/">
        <span class="brand__mark">OX</span>
        <span class="brand__name">Bracket Studio</span>
        <span class="brand__tag">private visualizer</span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/" data-route="/" class="active">Dashboard</a>
        <a href="#/tournaments" data-route="/tournaments">Tournaments</a>
        <a href="#/news" data-route="/news">News</a>
        <a href="#/settings" data-route="/settings">Settings</a>
      </nav>

      <div class="actions">
        <div class="search">
          <input id="globalSearch" placeholder="Search tournaments, teams, news…" />
          <div class="x" id="clearSearch" title="Clear">×</div>
        </div>
        <button class="btn btn--ghost" id="themeToggle">Theme</button>
        <button class="btn btn--ghost" id="presentationToggle">Presentation</button>
        <button class="btn" id="exportPngBtn">Export PNG</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="layout">
      <!-- LEFT -->
      <section class="panel leftPane" id="leftPane">
        <div class="panel__head">
          <h2 class="panel__title">Admin</h2>
          <div class="panel__meta" id="adminMeta">Locked</div>
        </div>
        <div class="panel__body" id="adminPanel"></div>
      </section>

      <!-- RIGHT -->
      <section class="panel">
        <div class="panel__head">
          <div>
            <h2 class="panel__title" id="viewTitle">Dashboard</h2>
            <div class="panel__meta" id="viewMeta"></div>
          </div>
          <div class="rightControls" style="display:flex; gap:10px; align-items:center">
            <span class="pill" id="activePill">No active tournament</span>

  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">

      <div class="modalHead">
        <h3 class="modalTitle" id="modalTitle">Modal</h3>
        <button class="btn btn--ghost" id="modalClose">Close</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalFoot" id="modalFoot"></div>
    </div>
  </div>

<script>
/* =========================================================
  OXeall Bracket Studio — Single-file SPA
  - Storage: localStorage (export/import JSON)
  - Admin: client-side passphrase lock
  - Tournaments: Swiss / Single / Double / Groups
  - News module: create posts (linked to tournament)
  - Swiss pairing: score groups, anti-rematch, seeded tiebreak
  - Visuals: Swiss cards + standings; Elim via SVG bracket
  - Export: PNG of canvas (presentation-friendly)
========================================================= */

/* -------------------- Utilities -------------------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = (p="id") => `${p}_${Math.random().toString(16).slice(2)}_${Date.now().toString(16)}`;
const clamp = (n,min,max) => Math.max(min, Math.min(max, n));
const safeInt = (v, d=0) => {
  const n = Number.parseInt(String(v), 10);
  return Number.isFinite(n) ? n : d;
};
const nowISO = () => new Date().toISOString();
const fmtLocal = (iso) => new Intl.DateTimeFormat(undefined, {
  year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit"
}).format(new Date(iso));

function hashString(str){
  // simple non-crypto hash (client lock only)
  let h = 2166136261;
  for (let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

/* -------------------- Storage -------------------- */
const STORE_KEY = "ox_bracket_studio_v1";

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch{ return null; }
}

function saveStore(store){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

/* -------------------- Domain Model -------------------- */
/**
 Store shape:
 {
  version: 1,
  security: { passHash: string|null, unlockedUntil: number|null },
  ui: { theme: "dark"|"light", presentation: boolean, search: string },
  activeTournamentId: string|null,
  tournaments: {
    [id]: {
      id, name, type, createdAt, status,
      config: { teamsCount, ...typeSpecific },
      teams: [{id,name,tag,seed}],
      // matches by stage/round depending type
      swiss?: { rounds: number, currentRound: number, matchesByRound: { [round]: Match[] }, results: { [matchId]: {a,b,status,notes} } },
      elim?: { kind:"single"|"double", rounds: RoundNode[], nodes: { [nodeId]: ElimNode }, settings },
      groups?: { groups: Group[], matches: GroupMatch[], settings },
      meta: { notes }
    }
  },
  news: [{id,title,body,createdAt,tournamentId|null,tags:[]}]
 }
*/

function defaultStore(){
  return {
    version: 1,
    security: { passHash: null, unlockedUntil: null },
    ui: { theme: "dark", presentation: false, search: "" },
    activeTournamentId: null,
    tournaments: {},
    news: []
  };
}

/* -------------------- Swiss Logic -------------------- */
/**
 Swiss rules in this tool:
 - Teams have record (wins/losses)
 - Pairing per round:
   1) Group by record (wins-losses)
   2) Within each group, sort by: wins desc, Buchholz desc, seed asc (seed tie-break)
   3) Pair top vs bottom within group (like "high-low"), avoid rematches
   4) If odd group, float one team down to next lower group (lowest priority by seed / already floated)
 - Rematch avoidance: try swaps within group; if cannot avoid, allow rematch.
 - Results update records and Buchholz.
*/

function swissInit(t){
  const rounds = t.config.rounds ?? Math.ceil(Math.log2(Math.max(2, t.config.teamsCount||16))) + 2;
  t.swiss = {
    rounds,
    currentRound: 1,
    matchesByRound: {},
    teamState: {}, // { teamId: {wins,losses,buchholz,opponents:Set } } (opponents stored as array for serialization)
    settings: {
      formatDefault: t.config.formatDefault || "bo3",
      winReq: t.config.winReq ?? 3,
      loseReq: t.config.loseReq ?? 3
    }
  };
  for(const tm of t.teams){
    t.swiss.teamState[tm.id] = { wins:0, losses:0, buchholz:0, opponents:[] };
  }
}

function swissRecomputeBuchholz(t){
  // buchholz: sum of opponents' wins (simple)
  const st = t.swiss.teamState;
  for(const id in st){
    let sum = 0;
    for(const opp of st[id].opponents){
      sum += (st[opp]?.wins ?? 0);
    }
    st[id].buchholz = sum;
  }
}

function swissScoreKey(st){ return `${st.wins}-${st.losses}`; }

function swissGroupTeams(t){
  const st = t.swiss.teamState;
  const groups = new Map(); // key -> teamId[]
  for(const tm of t.teams){
    const s = st[tm.id];
    const key = swissScoreKey(s);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(tm.id);
  }

  // Sort group keys by wins desc then losses asc
  const keys = Array.from(groups.keys()).sort((a,b)=>{
    const [aw,al] = a.split("-").map(Number);
    const [bw,bl] = b.split("-").map(Number);
    if (aw !== bw) return bw - aw;
    return al - bl;
  });

  return { keys, groups };
}

function swissSortGroup(t, teamIds){
  const st = t.swiss.teamState;
  const byId = new Map(t.teams.map(x=>[x.id,x]));
  // sort by wins desc, buchholz desc, seed asc
  return teamIds.slice().sort((a,b)=>{
    const sa = st[a], sb = st[b];
    if (sa.wins !== sb.wins) return sb.wins - sa.wins;
    if (sa.buchholz !== sb.buchholz) return sb.buchholz - sa.buchholz;
    return (byId.get(a).seed ?? 9999) - (byId.get(b).seed ?? 9999);
  });
}

function hasRematch(t, aId, bId){
  const opp = t.swiss.teamState[aId].opponents;
  return opp.includes(bId);
}

function attemptPairingAvoidRematch(t, sorted){
  // Pair top vs bottom, try swapping to avoid rematches
  const pairs = [];
  const used = new Set();
  const n = sorted.length;
  for(let i=0; i<n/2; i++){
    const a = sorted[i];
    const b = sorted[n-1-i];
    pairs.push([a,b]);
  }

  // If rematches exist, try to fix with simple swaps among second elements
  for(let i=0; i<pairs.length; i++){
    let [a,b] = pairs[i];
    if(!hasRematch(t,a,b)) continue;

    // try find j != i to swap b with pairs[j][1]
    let fixed = false;
    for(let j=i+1; j<pairs.length; j++){
      const [a2,b2] = pairs[j];
      if(!hasRematch(t,a,b2) && !hasRematch(t,a2,b)){
        pairs[i] = [a,b2];
        pairs[j] = [a2,b];
        fixed = true;
        break;
      }
    }
    if(!fixed){
      // try swap with other side: swap a with pairs[j][0]
      for(let j=i+1; j<pairs.length; j++){
        const [a2,b2] = pairs[j];
        if(!hasRematch(t,a2,b) && !hasRematch(t,a,b2)){
          pairs[i] = [a2,b];
          pairs[j] = [a,b2];
          fixed = true;
          break;
        }
      }
    }
  }

  return pairs;
}

function swissGenerateRound(t, round){
  swissRecomputeBuchholz(t);

  const { keys, groups } = swissGroupTeams(t);
  const allPairs = [];
  let floater = null;

  // We will iterate from best record group downwards,
  // floating one team down if odd.
  for(let idx=0; idx<keys.length; idx++){
    const key = keys[idx];
    let ids = groups.get(key) || [];
    // apply floater from previous higher group
    if(floater){
      ids = ids.concat([floater]);
      floater = null;
    }
    ids = swissSortGroup(t, ids);

    if(ids.length % 2 === 1){
      // float the lowest priority team down:
      // choose last in sorted list (worst by our ordering)
      floater = ids.pop();
    }

    const pairs = attemptPairingAvoidRematch(t, ids);
    for(const [a,b] of pairs){
      allPairs.push([a,b,key]);
    }
  }

  if(floater){
    // if still exists, pair with nearest possible by pulling from last group
    // safest: bye match (counts as win) only if configured; default: create "BYE" as auto win
    allPairs.push([floater, null, "BYE"]);
  }

  // Convert to Match objects
  const byId = new Map(t.teams.map(x=>[x.id,x]));
  const matches = allPairs.map(([a,b,grp])=>{
    const id = uid(`sw_r${round}`);
    return {
      id,
      round,
      group: grp,
      format: t.swiss.settings.formatDefault,
      a: a ? { teamId:a } : null,
      b: b ? { teamId:b } : null,
      scoreA: null,
      scoreB: null,
      status: b ? "PENDING" : "BYE",
      notes: ""
    };
  });

  t.swiss.matchesByRound[String(round)] = matches;

  // Auto-resolve BYE as win
  for(const m of matches){
    if(m.status === "BYE" && m.a?.teamId){
      m.scoreA = 1;
      m.scoreB = 0;
      m.status = "DONE";
      applySwissResult(t, m.id);
    }
  }
}

function applySwissResult(t, matchId){
  const round = t.swiss.currentRound;
  const matches = t.swiss.matchesByRound[String(round)] || [];
  const m = matches.find(x=>x.id===matchId);
  if(!m) return;

  if(m.status !== "DONE") return;
  if(!m.a?.teamId || !m.b?.teamId) return;

  const st = t.swiss.teamState;
  const aId = m.a.teamId, bId = m.b.teamId;

  // prevent double-apply: recalc from scratch across rounds
  swissRebuildStateFromHistory(t);
}

function swissRebuildStateFromHistory(t){
  // reset
  const byId = new Map(t.teams.map(x=>[x.id,x]));
  for(const tm of t.teams){
    t.swiss.teamState[tm.id] = { wins:0, losses:0, buchholz:0, opponents:[] };
  }

  // apply results round by round
  for(let r=1; r<=t.swiss.rounds; r++){
    const matches = t.swiss.matchesByRound[String(r)] || [];
    for(const m of matches){
      if(m.status !== "DONE") continue;
      const aId = m.a?.teamId, bId = m.b?.teamId;
      if(!aId) continue;
      if(!bId) continue;

      const aWin = (safeInt(m.scoreA,0) > safeInt(m.scoreB,0));
      const bWin = (safeInt(m.scoreB,0) > safeInt(m.scoreA,0));

      if(aWin === bWin) continue; // ignore ties (shouldn't happen)

      if(!t.swiss.teamState[aId].opponents.includes(bId)) t.swiss.teamState[aId].opponents.push(bId);
      if(!t.swiss.teamState[bId].opponents.includes(aId)) t.swiss.teamState[bId].opponents.push(aId);

      if(aWin){
        t.swiss.teamState[aId].wins += 1;
        t.swiss.teamState[bId].losses += 1;
      }else{
        t.swiss.teamState[bId].wins += 1;
        t.swiss.teamState[aId].losses += 1;
      }
    }
  }

  swissRecomputeBuchholz(t);
}

/* -------------------- Elimination (Single/Double) -------------------- */
/**
 We render bracket using SVG for clean screenshots.
 Implementation:
 - For SINGLE: standard power-of-two bracket with BYEs (auto-advance)
 - For DOUBLE: simplified structure (Upper + Lower) for 8/16 teams; robust enough for visualization/editor
 - Nodes store: teamIdA/teamIdB, scoreA/scoreB, winner -> progresses to next node
*/

function nextPow2(n){
  let p=1; while(p<n) p<<=1;
  return p;
}

function elimInit(t, kind){
  const n = t.teams.length;
  const size = nextPow2(Math.max(2,n));
  const rounds = Math.log2(size);

  t.elim = {
    kind,
    size,
    rounds,
    nodes: {},
    links: [], // {fromNodeId, toNodeId, slot:"A"|"B"} for winner placement (single) and (double simplified)
    settings: { formatDefault: t.config.formatDefault || "bo3" }
  };

  if(kind === "single"){
    buildSingleElim(t);
  } else {
    buildDoubleElimSimplified(t);
  }
}

function buildSingleElim(t){
  const size = t.elim.size;
  const rounds = t.elim.rounds;

  // Seed ordering: 1 vs size, 2 vs size-1, etc.
  const seedMap = new Map(t.teams.map(x=>[x.seed,x]));
  const slots = Array(size).fill(null);
  for(let s=1; s<=size; s++){
    slots[s-1] = seedMap.get(s)?.id ?? null;
  }

  // Standard seed pairing for first round: (1,size), (2,size-1), ...
  const firstPairs = [];
  for(let i=0;i<size/2;i++){
    firstPairs.push([slots[i], slots[size-1-i]]);
  }

  // Create nodes per round
  const nodeIdAt = (r, i) => `U_r${r}_m${i}`;
  for(let r=1; r<=rounds; r++){
    const matches = size / (2**r);
    for(let i=1;i<=matches;i++){
      t.elim.nodes[nodeIdAt(r,i)] = {
        id: nodeIdAt(r,i),
        bracket: "U",
        round: r,
        index: i,
        format: t.elim.settings.formatDefault,
        teamA: null, teamB: null,
        scoreA: null, scoreB: null,
        status: "PENDING"
      };
    }
  }

  // Fill round 1
  for(let i=1;i<=firstPairs.length;i++){
    const n = t.elim.nodes[nodeIdAt(1,i)];
    n.teamA = firstPairs[i-1][0];
    n.teamB = firstPairs[i-1][1];
    // BYE auto-advance
    if(n.teamA && !n.teamB){ n.scoreA=1; n.scoreB=0; n.status="DONE"; }
    if(!n.teamA && n.teamB){ n.scoreA=0; n.scoreB=1; n.status="DONE"; }
  }

  // Winner links to next round
  for(let r=1; r<rounds; r++){
    const matches = size / (2**r);
    for(let i=1;i<=matches;i++){
      const from = nodeIdAt(r,i);
      const to = nodeIdAt(r+1, Math.ceil(i/2));
      const slot = (i % 2 === 1) ? "A" : "B";
      t.elim.links.push({ fromNodeId: from, toNodeId: to, slot });
    }
  }

  // Apply propagation for BYEs immediately
  elimPropagateAll(t);
}

function buildDoubleElimSimplified(t){
  // NOTE: This is a “practical” double-elim generator for visualization/editor,
  // best for 8 or 16 teams. For other sizes it still builds but structure is simplified.
  const size = t.elim.size;
  const rounds = t.elim.rounds;

  // Upper bracket nodes similar to single
  const nodeU = (r,i) => `U_r${r}_m${i}`;
  const nodeL = (r,i) => `L_r${r}_m${i}`;

  // Build upper nodes
  for(let r=1; r<=rounds; r++){
    const matches = size / (2**r);
    for(let i=1;i<=matches;i++){
      t.elim.nodes[nodeU(r,i)] = {
        id: nodeU(r,i), bracket:"U", round:r, index:i,
        format: t.elim.settings.formatDefault,
        teamA:null, teamB:null, scoreA:null, scoreB:null, status:"PENDING"
      };
    }
  }

  // Build lower nodes: typical lower has (rounds-1)*2 - 1 stages in full model,
  // but we implement 2*(rounds-1) stages with decreasing matches.
  // Example for 8 (rounds=3): L stages 1..4: 2,2,1,1 matches.
  const lowerStages = Math.max(2, (rounds-1)*2);
  for(let s=1; s<=lowerStages; s++){
    const matches = Math.max(1, size / 4 / (2**Math.floor((s-1)/2)));
    for(let i=1;i<=matches;i++){
      t.elim.nodes[nodeL(s,i)] = {
        id: nodeL(s,i), bracket:"L", round:s, index:i,
        format: t.elim.settings.formatDefault,
        teamA:null, teamB:null, scoreA:null, scoreB:null, status:"PENDING"
      };
    }
  }

  // Seed into upper round 1
  const seedMap = new Map(t.teams.map(x=>[x.seed,x]));
  const slots = Array(size).fill(null);
  for(let s=1; s<=size; s++){
    slots[s-1] = seedMap.get(s)?.id ?? null;
  }
  const firstPairs = [];
  for(let i=0;i<size/2;i++){
    firstPairs.push([slots[i], slots[size-1-i]]);
  }
  for(let i=1;i<=firstPairs.length;i++){
    const n = t.elim.nodes[nodeU(1,i)];
    n.teamA = firstPairs[i-1][0];
    n.teamB = firstPairs[i-1][1];
    if(n.teamA && !n.teamB){ n.scoreA=1; n.scoreB=0; n.status="DONE"; }
    if(!n.teamA && n.teamB){ n.scoreA=0; n.scoreB=1; n.status="DONE"; }
  }

  // Upper winner links (like single)
  for(let r=1; r<rounds; r++){
    const matches = size / (2**r);
    for(let i=1;i<=matches;i++){
      const from = nodeU(r,i);
      const to = nodeU(r+1, Math.ceil(i/2));
      const slot = (i % 2 === 1) ? "A" : "B";
      t.elim.links.push({ fromNodeId: from, toNodeId: to, slot, mode:"WINNER" });
    }
  }

  // Upper loser drops to Lower:
  // - Losers from U round 1 -> L stage 1 (slot A/B)
  // - Losers from U round 2 -> L stage 2
  // - Losers from U round 3 -> L stage 4 ... (simplified mapping)
  for(let r=1; r<=rounds-1; r++){
    const matches = size / (2**r);
    const targetStage = (r === 1) ? 1 : (r === 2 ? 2 : Math.min((r-1)*2, (rounds-1)*2));
    for(let i=1;i<=matches;i++){
      const from = nodeU(r,i);
      const to = nodeL(targetStage, Math.ceil(i/2));
      const slot = (i % 2 === 1) ? "A" : "B";
      t.elim.links.push({ fromNodeId: from, toNodeId: to, slot, mode:"LOSER" });
    }
  }

  // Lower winner advances through lower stages (chain)
  const lowerStages = Math.max(2, (rounds-1)*2);
  for(let s=1; s<lowerStages; s++){
    const stageMatches = Object.values(t.elim.nodes).filter(n=>n.bracket==="L" && n.round===s).length;
    for(let i=1;i<=stageMatches;i++){
      const from = nodeL(s,i);
      const nextMatches = Object.values(t.elim.nodes).filter(n=>n.bracket==="L" && n.round===s+1).length;
      const to = nodeL(s+1, Math.ceil(i/2));
      const slot = (i % 2 === 1) ? "A" : "B";
      t.elim.links.push({ fromNodeId: from, toNodeId: to, slot, mode:"WINNER" });
    }
  }

  // Grand Final node
  const gfId = "GF";
  t.elim.nodes[gfId] = {
    id: gfId, bracket:"GF", round:1, index:1,
    format: t.elim.settings.formatDefault,
    teamA:null, teamB:null, scoreA:null, scoreB:null, status:"PENDING"
  };

  // Upper final winner -> GF A
  t.elim.links.push({ fromNodeId: nodeU(rounds,1), toNodeId: gfId, slot:"A", mode:"WINNER" });

  // Lower final winner -> GF B (use last lower stage match 1)
  const lastL = `L_r${lowerStages}_m1`;
  if(t.elim.nodes[lastL]){
    t.elim.links.push({ fromNodeId: lastL, toNodeId: gfId, slot:"B", mode:"WINNER" });
  }

  elimPropagateAll(t);
}

function elimWinner(node){
  const a = safeInt(node.scoreA, NaN);
  const b = safeInt(node.scoreB, NaN);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return null;
  if(a===b) return null;
  return (a>b) ? node.teamA : node.teamB;
}
function elimLoser(node){
  const a = safeInt(node.scoreA, NaN);
  const b = safeInt(node.scoreB, NaN);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return null;
  if(a===b) return null;
  return (a>b) ? node.teamB : node.teamA;
}

function elimClearDownstream(t, fromNodeId){
  // When editing a match, clear all downstream placements from its outputs
  for(const link of t.elim.links){
    if(link.fromNodeId !== fromNodeId) continue;
    const to = t.elim.nodes[link.toNodeId];
    if(!to) continue;
    if(link.slot==="A") to.teamA = null;
    if(link.slot==="B") to.teamB = null;
    to.scoreA = null; to.scoreB = null; to.status = "PENDING";
    // cascade
    elimClearDownstream(t, to.id);
  }
}

function elimPropagateAll(t){
  // Recompute placements from scratch
  // 1) Reset all non-round1 seeded nodes (except those already seeded)
  // We'll do repeated relaxation passes until stable.
  const maxPass = 20;
  for(let pass=0; pass<maxPass; pass++){
    let changed = false;
    for(const link of t.elim.links){
      const from = t.elim.nodes[link.fromNodeId];
      const to = t.elim.nodes[link.toNodeId];
      if(!from || !to) continue;

      const team = (link.mode==="LOSER") ? elimLoser(from) : elimWinner(from);
      if(!team) continue;

      if(link.slot==="A"){
        if(to.teamA !== team){ to.teamA = team; changed = true; }
      }else{
        if(to.teamB !== team){ to.teamB = team; changed = true; }
      }

      // Auto-advance BYE situations in downstream
      if(to.teamA && !to.teamB && to.bracket!=="GF"){
        to.scoreA = 1; to.scoreB = 0; to.status="DONE"; changed=true;
      }
      if(!to.teamA && to.teamB && to.bracket!=="GF"){
        to.scoreA = 0; to.scoreB = 1; to.status="DONE"; changed=true;
      }
    }
    if(!changed) break;
  }
}

/* -------------------- Groups -------------------- */
function groupsInit(t){
  // Settings
  const gCount = t.config.groupCount ?? 2;
  const teamsPer = t.config.teamsPerGroup ?? Math.floor((t.teams.length || t.config.teamsCount) / gCount);

  // Distribute by seed snake draft
  const sorted = t.teams.slice().sort((a,b)=>a.seed-b.seed);
  const groups = Array.from({length:gCount}, (_,i)=>({ id: `G${String.fromCharCode(65+i)}`, name:`Group ${String.fromCharCode(65+i)}`, teamIds: [] }));
  let dir = 1, gi = 0;
  for(const tm of sorted){
    groups[gi].teamIds.push(tm.id);
    if(dir===1){
      gi++;
      if(gi>=gCount){ gi=gCount-1; dir=-1; }
    }else{
      gi--;
      if(gi<0){ gi=0; dir=1; }
    }
  }

  t.groups = {
    settings: {
      groupCount: gCount,
      pointsWin: t.config.pointsWin ?? 1,
      pointsLoss: t.config.pointsLoss ?? 0,
      formatDefault: t.config.formatDefault || "bo1"
    },
    groups,
    matches: []
  };

  // Generate round robin matches per group
  for(const g of groups){
    const ids = g.teamIds.slice();
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        t.groups.matches.push({
          id: uid(`grp_${g.id}`),
          groupId: g.id,
          format: t.groups.settings.formatDefault,
          a: ids[i],
          b: ids[j],
          scoreA: null,
          scoreB: null,
          status: "PENDING"
        });
      }
    }
  }
}

function groupsStandings(t, groupId){
  const g = t.groups.groups.find(x=>x.id===groupId);
  if(!g) return [];
  const ptsW = t.groups.settings.pointsWin;
  const ptsL = t.groups.settings.pointsLoss;

  const table = new Map();
  for(const id of g.teamIds){
    table.set(id, { teamId:id, played:0, win:0, loss:0, points:0, diff:0 });
  }

  const matches = t.groups.matches.filter(m=>m.groupId===groupId);
  for(const m of matches){
    if(m.status!=="DONE") continue;
    const a = safeInt(m.scoreA,0), b = safeInt(m.scoreB,0);
    const ra = table.get(m.a), rb = table.get(m.b);
    ra.played++; rb.played++;
    ra.diff += (a-b); rb.diff += (b-a);
    if(a>b){
      ra.win++; rb.loss++;
      ra.points += ptsW; rb.points += ptsL;
    }else if(b>a){
      rb.win++; ra.loss++;
      rb.points += ptsW; ra.points += ptsL;
    }
  }

  // sort by points desc, diff desc, seed asc
  const byTeam = new Map(t.teams.map(x=>[x.id,x]));
  return Array.from(table.values()).sort((x,y)=>{
    if(x.points!==y.points) return y.points-x.points;
    if(x.diff!==y.diff) return y.diff-x.diff;
    return (byTeam.get(x.teamId)?.seed ?? 9999) - (byTeam.get(y.teamId)?.seed ?? 9999);
  });
}

/* -------------------- App State -------------------- */
let STORE = loadStore() || defaultStore();

function persist(){
  saveStore(STORE);
}

function isUnlocked(){
  const until = STORE.security.unlockedUntil;
  if(!until) return false;
  return Date.now() < until;
}

function lock(){
  STORE.security.unlockedUntil = null;
  persist();
  render();
}

function unlock(pass){
  if(!STORE.security.passHash){
    // first-time set
    STORE.security.passHash = hashString(pass);
    STORE.security.unlockedUntil = Date.now() + 6*60*60*1000; // 6 hours
    persist();
    render();
    return true;
  }
  if(hashString(pass) === STORE.security.passHash){
    STORE.security.unlockedUntil = Date.now() + 6*60*60*1000;
    persist();
    render();
    return true;
  }
  return false;
}

function activeTournament(){
  const id = STORE.activeTournamentId;
  if(!id) return null;
  return STORE.tournaments[id] || null;
}

function setActiveTournament(id){
  STORE.activeTournamentId = id;
  persist();
  render();
}

/* -------------------- Router -------------------- */
function route(){
  const h = (location.hash || "#/").replace("#","");
  if(h==="/" || h==="") return "/";
  const top = h.split("?")[0];
  if(top.startsWith("/tournaments")) return "/tournaments";
  if(top.startsWith("/news")) return "/news";
  if(top.startsWith("/settings")) return "/settings";
  return "/";
}

function renderAdminPanel(){

  if(!unlocked){
    return `
      <div class="field">
        <div class="label"><span>Admin passphrase</span><span class="muted">client-side lock</span></div>
        <input class="input" id="passInput" type="password" placeholder="Enter passphrase" />
      </div>

function renderSwissCanvas(t){

    return `<div class="hint">Swiss not initialized. Open tournament edit and initialize Swiss.</div>`;

  const matches = (t.swiss.matchesByRound[String(r)] || []).slice();
  const byGroup = new Map();
  for(const m of matches){
    const g = m.group || "—";
    if(!byGroup.has(g)) byGroup.set(g, []);
    byGroup.get(g).push(m);

    if(a==="BYE") return 1;
    if(b==="BYE") return -1;

    const scoreB = (m.scoreB ?? "");
    const done = (m.status==="
